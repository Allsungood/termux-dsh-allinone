name: termux_dsh_allinone
description: One-tap Android launcher for dsh (DeepSeek Harness), OpenClaw, Ollama and a full Linux toolchain, powered by a bundled PRoot runtime.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
