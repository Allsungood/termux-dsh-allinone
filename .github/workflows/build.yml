name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold the Android platform
        working-directory: flutter_app
        run: |
          # The repository deliberately does not commit a hand-written Android
          # project: `flutter create` generates one that always matches the
          # installed Flutter version (including the binary gradle wrapper).
          flutter create \
            --platforms=android \
            --org com.allsungood \
            --project-name termux_dsh_allinone \
            "$RUNNER_TEMP/scaffold"
          rm -rf android
          cp -r "$RUNNER_TEMP/scaffold/android" android

      - name: Patch the Android project for the PRoot runtime
        run: python3 .github/scripts/patch_android.py

      - name: Resolve packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyse
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: flutter_app
        run: flutter test

      - name: Build per-ABI APKs
        working-directory: flutter_app
        run: |
          # --split-per-abi, not --target-platform: the latter still packages
          # plugin AAR native libs for every ABI while the Flutter engine libs
          # (libflutter.so / libapp.so) only exist for the requested one. The
          # result installs on a device the engine was not built for and then
          # crashes on startup. Per-ABI splits filter every library properly.
          flutter build apk --release --split-per-abi

      - name: Stage the supported APKs
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk termux-allinone-arm64.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk termux-allinone-x86_64.apk

      - name: Assert each APK is self-consistent
        run: python3 .github/scripts/verify_apk_abis.py

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-allinone-apks
          if-no-files-found: error
          path: |
            termux-allinone-arm64.apk
            termux-allinone-x86_64.apk

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            termux-allinone-arm64.apk
            termux-allinone-x86_64.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
